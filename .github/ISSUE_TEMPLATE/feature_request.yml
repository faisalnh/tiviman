name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation on the TV, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How would it work with the remote?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This doesn't require bundled channels, bypassing provider authentication, or cloning a device identity.
          required: true
